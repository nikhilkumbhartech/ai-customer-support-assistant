services:
  db:
    image: pgvector/pgvector:pg16
    container_name: support_db
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support123
      POSTGRES_DB: support_ai
    ports:
     - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/backend-schema.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata: